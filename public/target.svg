<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2323f"/>
      <stop offset="100%" stop-color="#c40012"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ff5b64" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff5b64" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>

  <!-- Brand wordmark & smile -->
  <text x="40" y="90" font-family="Arial Black, Arial, sans-serif" font-size="56" font-weight="900" font-style="italic" fill="#ffffff">Colgate</text>

  <!-- Campaign headline: Ndio Kusema -->
  <text x="40" y="150" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff">Ndio Kusema</text>
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffe9e9">New Reduced Price</text>

  <!-- Toothpaste boxes -->
  <g transform="translate(40,420)">
    <rect width="220" height="260" rx="14" fill="#ffffff"/>
    <rect width="220" height="70" rx="14" fill="#2e7d32"/>
    <text x="20" y="45" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" font-style="italic" fill="#ffffff">Colgate</text>
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1b3a1e">Herbal</text>
    <rect x="20" y="200" width="130" height="40" rx="8" fill="#ffd400"/>
    <text x="35" y="228" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#7a1f00">NOW 150</text>
  </g>

  <g transform="translate(300,420)">
    <rect width="220" height="260" rx="14" fill="#ffffff"/>
    <rect width="220" height="70" rx="14" fill="#0d47a1"/>
    <text x="20" y="45" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" font-style="italic" fill="#ffffff">Colgate</text>
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0a2540">Max Fresh</text>
    <rect x="20" y="200" width="130" height="40" rx="8" fill="#ffd400"/>
    <text x="35" y="228" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#7a1f00">NOW 120</text>
  </g>

  <!-- Spokesperson pointing finger up -->
  <g transform="translate(480,110)">
    <!-- Face & Body -->
    <circle cx="160" cy="170" r="140" fill="#7d4e38"/>
    <path d="M 30 160 Q 160 270 290 160 L 290 50 Q 160 -10 30 50 Z" fill="#1a1a1a"/>
    <!-- Glasses -->
    <rect x="70" y="140" width="75" height="50" rx="12" fill="none" stroke="#000000" stroke-width="8"/>
    <rect x="175" y="140" width="75" height="50" rx="12" fill="none" stroke="#000000" stroke-width="8"/>
    <line x1="145" y1="162" x2="175" y2="162" stroke="#000000" stroke-width="8"/>
    <!-- Smile -->
    <path d="M 95 235 Q 160 290 225 235" fill="#ffffff" stroke="#000000" stroke-width="6"/>
    <!-- White shirt -->
    <path d="M 40 310 L 280 310 L 310 460 L 10 460 Z" fill="#ffffff"/>
    <path d="M 120 310 L 160 380 L 200 310" fill="none" stroke="#d0d0d0" stroke-width="4"/>
    <!-- Pointing Finger Up -->
    <g transform="translate(-40, 200)">
      <rect x="40" y="40" width="30" height="90" rx="15" fill="#7d4e38"/>
      <rect x="40" y="0" width="28" height="60" rx="14" fill="#7d4e38"/>
    </g>
  </g>

  <!-- Bottom Brand Arc -->
  <g transform="translate(0,700)">
    <rect width="800" height="100" fill="#ffffff" opacity="0.08"/>
    <path d="M120 20 Q400 110 680 20" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
